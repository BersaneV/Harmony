name: Diagnose native timing under eight published Windows EXEs
on:
  workflow_dispatch:
    inputs:
      profile:
        description: DIAGNOSTIC only; unchanged 60 FPS profile, never capacity approval
        type: choice
        options: ["1080p60", "1440p60"]
        default: "1440p60"
permissions:
  contents: read
concurrency:
  group: exe-wan
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cohort: ${{ steps.fixture.outputs.cohort }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "26.13.0" }
      - name: Require the actual public 0.4.8 manifest
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const release=JSON.parse(await readFile('scripts/exe-wan/releases/0.4.8.json','utf8'));
          assert.equal(release.version,'0.4.8');
          assert.equal(release.installer_url,'https://github.com/BersaneV/Harmony/releases/download/v0.4.8/Harmony_0.4.8_x64-setup.exe');
          for(const k of ['installer_sha256','main_sha256']) assert.match(release[k],/^[a-f0-9]{64}$/);
          JS
      - name: Validate protocol, deadlines, load guards and existing hook passivity
        run: node --test scripts/exe-wan/timing-load-diagnostic.test.mjs scripts/exe-wan/timing-diagnostic.test.mjs scripts/exe-wan/capture-ui.test.mjs scripts/exe-wan/fixture-contract.test.mjs scripts/exe-wan/profiles.test.mjs
      - name: Allow the preceding HTTP quota window to clear before preparing once
        run: sleep 60
      - name: Prepare eight ordinary private test accounts
        id: fixture
        env:
          HARMONY_EXE_WAN_SEED: ${{ secrets.HARMONY_EXE_WAN_SEED }}
        run: node scripts/exe-wan/prepare.mjs
  windows:
    needs: prepare
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false && contains(fromJSON('["1080p60","1440p60"]'), inputs.profile)
    name: Diagnostic client ${{ matrix.client }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        client: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HARMONY_EXE_RELEASE: "0.4.8"
      HARMONY_EXE_PROFILE: ${{ inputs.profile }}
      HARMONY_CLIENT_INDEX: ${{ matrix.client }}
      HARMONY_TIMING_LOAD_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      HARMONY_EXE_WAN_SEED: ${{ secrets.HARMONY_EXE_WAN_SEED }}
      HARMONY_COHORT: ${{ needs.prepare.outputs.cohort }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "26.13.0" }
      - name: Verify and install the immutable public 0.4.8 EXE
        shell: pwsh
        run: ./scripts/exe-wan/install.ps1
      - name: Keep one screen, seven receivers and all microphone streams active; diagnostic only
        run: node scripts/exe-wan/timing-load-diagnostic.mjs
