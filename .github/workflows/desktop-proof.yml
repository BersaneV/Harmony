name: Verify Windows after unchanged server sources
on:
  workflow_dispatch:
    inputs:
      verified_server_run:
        type: string
        required: true
      package:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-proof-main
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false && inputs.package
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify successful server gate and identical product sources
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SERVER_RUN: ${{ inputs.verified_server_run }}
        run: python scripts/verify_server_source.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1"}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tools/theme-review.test.ts
      - name: Check Windows capture bridge and guards
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test native update and capture policy
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace
      - name: Build without distribution signing on ordinary pushes
        if: github.event_name != 'workflow_dispatch' || !inputs.package
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/ci-unsigned.json
          npm run desktop:build -- --bundles nsis --config src-tauri/ci-unsigned.json
      - name: Build signed distribution on trusted main
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify updater signatures using the official plugin
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cargo build --locked --manifest-path tools/updater-check/Cargo.toml
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $key = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).plugins.updater.pubkey
          $key | Set-Content -Encoding utf8NoBOM updater-public.key
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          python tools/updater-check/test_updater.py --artifact $artifact --signature "$artifact.sig" --public-key updater-public.key --version $version --output .local/qa-updater/windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and remove on disposable Windows runner
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          ./scripts/test_windows_install.ps1 -Path $artifact -Version $version -Output .local/qa-updater/windows-install.json
      - name: Hash the Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Save signed installer as a draft versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "Harmony $version, commit $env:GITHUB_SHA.`n`n" + (Get-Content "docs/releases/$version.md" -Raw)
          $notes | Out-File -Encoding utf8 release-notes.txt
          $files = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*).FullName
          gh release create $tag @files .local/qa-updater/windows-release.json .local/qa-updater/windows-install.json .local/qa-updater/windows-invite.json .local/qa-updater/windows-audio.json --draft --prerelease --target $env:GITHUB_SHA --title "Harmony $version — Windows" --notes-file release-notes.txt
      - name: Show bounded audio-control fixture evidence
        if: always()
        shell: pwsh
        run: Get-Content .local/qa-updater/windows-audio.json -ErrorAction SilentlyContinue
      - name: Preserve the candidate and fixture evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-controls-qa-candidate-${{ github.run_id }}
          retention-days: 1
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            .local/qa-updater/windows-audio.json
