name: Verify and build Harmony
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Sign Windows installer and save a versioned draft release after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generate disposable embedded instance
        run: python3 scripts/configure.py
      - run: python3 scripts/with-env.py cargo test --workspace --locked -- --include-ignored
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
      - run: npm run build
      - name: Start private LiveKit
        run: docker run -d --name harmony-livekit --network host -v "$PWD/.local/deploy/livekit.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20 --config /etc/livekit.yaml
      - name: Build the pinned media parsers
        run: |
          docker build --target ffmpeg -f infra/Dockerfile.harmony -t harmony-ffmpeg:ci .
          mkdir -p .local/vendor-ci
          docker create --name harmony-ffmpeg-export harmony-ffmpeg:ci /bin/true
          docker cp harmony-ffmpeg-export:/opt/ffmpeg .local/vendor-ci/
          docker rm harmony-ffmpeg-export
      - name: Build the media admission gateway and test dependencies
        run: |
          docker build -f infra/Dockerfile.caddy -t harmony-caddy:ci .
          docker create --name harmony-caddy-export harmony-caddy:ci /bin/true
          docker cp harmony-caddy-export:/usr/bin/caddy .local/vendor-ci/caddy
          docker rm harmony-caddy-export
          python3 -m venv .local/rtc-venv
          .local/rtc-venv/bin/pip install livekit==1.2.1 livekit-api==1.2.2
          python3 scripts/configure-media-test.py --output .local/media-ci.json
          CADDY_BIN="$PWD/.local/vendor-ci/caddy" HARMONY_REQUIRE_CADDY=1 python3 -m unittest discover -s scripts -p test_media_proxy.py
      - name: Embedded integration through HTTP, WebSocket and real WebRTC
        env:
          HARMONY_TRUST_PROXY: "true"
          HARMONY_TEST_STORAGE: "1"
          HARMONY_TEST_MEDIA: "1"
          HARMONY_CHROME: /usr/bin/google-chrome
        run: |
          cargo build --workspace --locked
          python3 scripts/with-env.py target/debug/harmony-server > .local/server-ci.log 2>&1 &
          server_pid=$!
          npm run dev > .local/vite-ci.log 2>&1 &
          web_pid=$!
          .local/vendor-ci/caddy run --config .local/media-ci.json > .local/media-ci.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$server_pid" "$web_pid" "$gateway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          python3 scripts/with-env.py node scripts/smoke.mjs
          python3 scripts/with-env.py node crates/server/tests/acl.mjs
          node scripts/test_local_storage.mjs
          python3 scripts/with-env.py node scripts/test-media-admission.mjs
          python3 scripts/with-env.py .local/rtc-venv/bin/python scripts/test_media_rtc.py
          FFMPEG_PATH="$PWD/.local/vendor-ci/ffmpeg/bin/ffmpeg" FFPROBE_PATH="$PWD/.local/vendor-ci/ffmpeg/bin/ffprobe" python3 scripts/with-env.py node scripts/test_worker.mjs
          python3 scripts/test_worker_sandbox.py --output .local/qa-worker-sandbox/linux-result.json
          python3 scripts/with-env.py node scripts/p2p-browser-test.mjs
      - name: Build and exercise the supervised deployment
        run: |
          docker rm -f harmony-livekit
          docker compose build harmony
          docker compose up -d harmony
          trap 'docker compose down' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          HARMONY_TEST_STORAGE=1 HARMONY_TEST_MEDIA=1 python3 scripts/with-env.py node scripts/smoke.mjs
          sh scripts/backup.sh "$PWD/.local/ci-backup"
          sh scripts/restore.sh "$PWD/.local/ci-backup" "$PWD/.local/ci-restored"
          docker compose restart harmony
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker compose logs --tail 40 harmony livekit 2>&1 || true
          tail -60 .local/server-ci.log 2>/dev/null || true
  desktop:
    needs: server
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1"}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tools/theme-review.test.ts
      - name: Test native update policy
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build without distribution signing on ordinary pushes
        if: github.event_name != 'workflow_dispatch' || !inputs.package
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/ci-unsigned.json
          npm run desktop:build -- --bundles nsis --config ci-unsigned.json
      - name: Build signed distribution on trusted main
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify updater signatures using the official plugin
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cargo build --locked --manifest-path tools/updater-check/Cargo.toml
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $key = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).plugins.updater.pubkey
          $key | Set-Content -Encoding utf8NoBOM updater-public.key
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          python tools/updater-check/test_updater.py --artifact $artifact --signature "$artifact.sig" --public-key updater-public.key --version $version --output .local/qa-updater/windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and remove on disposable Windows runner
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          ./scripts/test_windows_install.ps1 -Path $artifact -Version $version -Output .local/qa-updater/windows-install.json
      - name: Hash the Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Save signed installer as a draft versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "Harmony $version, commit $env:GITHUB_SHA. Atualizador com assinatura Ed25519 e versão vinculada; não é Authenticode. SQLite, arquivos locais, worker isolado, personalização e diagnóstico P2P. Captura, áudio e redes Windows exigem homologação física; P2P permanece diagnóstico temporário. Consulte docs/VALIDATION.md e docs/UPDATES.md."
          $notes | Out-File -Encoding utf8 release-notes.txt
          $files = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*).FullName
          gh release create $tag @files .local/qa-updater/windows-release.json .local/qa-updater/windows-install.json --draft --prerelease --target $env:GITHUB_SHA --title "Harmony $version — Windows" --notes-file release-notes.txt
