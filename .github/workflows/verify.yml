name: Verify and build Harmony
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Sign Windows installer and save a versioned draft release after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generate disposable embedded instance
        run: python3 scripts/configure.py --media-transport livekit
      - name: Validate parsed deployment mounts before compilation
        run: |
          umask 077
          docker compose config --format json > .local/compose-ci.json
          python3 - <<'PY'
          import json
          with open('.local/compose-ci.json') as source:
              service = json.load(source)['services']['harmony']
          targets = {mount.split(':', 1)[0] for mount in service['tmpfs']}
          assert targets and all(target.startswith('/') for target in targets), 'Every tmpfs target must be an absolute path'
          for setting in ('SQLITE_TMPDIR', 'WORKER_TEMP_DIR'):
              assert service['environment'][setting] in targets, f'{setting} must have a writable private tmpfs'
          PY
      - run: python3 scripts/with-env.py cargo test --workspace --locked -- --include-ignored
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
      - run: npm run build
      - name: Start private LiveKit
        run: docker run -d --name harmony-livekit --network host -v "$PWD/.local/deploy/livekit.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20 --config /etc/livekit.yaml
      - name: Build the pinned media parsers
        run: |
          docker build --target ffmpeg -f infra/Dockerfile.harmony -t harmony-ffmpeg:ci .
          mkdir -p .local/vendor-ci
          docker create --name harmony-ffmpeg-export harmony-ffmpeg:ci /bin/true
          docker cp harmony-ffmpeg-export:/opt/ffmpeg .local/vendor-ci/
          docker rm harmony-ffmpeg-export
      - name: Build the media admission gateway and test dependencies
        run: |
          docker build -f infra/Dockerfile.caddy -t harmony-caddy:ci .
          docker create --name harmony-caddy-export harmony-caddy:ci /bin/true
          docker cp harmony-caddy-export:/usr/bin/caddy .local/vendor-ci/caddy
          docker rm harmony-caddy-export
          python3 -m venv .local/rtc-venv
          .local/rtc-venv/bin/pip install livekit==1.2.1 livekit-api==1.2.2
          python3 scripts/configure-media-test.py --output .local/media-ci.json
          CADDY_BIN="$PWD/.local/vendor-ci/caddy" HARMONY_REQUIRE_CADDY=1 python3 -m unittest discover -s scripts -p test_media_proxy.py
      - name: Embedded integration through HTTP, WebSocket and real WebRTC
        env:
          HARMONY_TRUST_PROXY: "true"
          HARMONY_TEST_STORAGE: "1"
          HARMONY_TEST_MEDIA: "1"
          HARMONY_CHROME: /usr/bin/google-chrome
        run: |
          cargo build --workspace --locked
          python3 scripts/with-env.py target/debug/harmony-server > .local/server-ci.log 2>&1 &
          server_pid=$!
          node node_modules/vite/bin/vite.js apps/desktop --host 127.0.0.1 --port 1420 --strictPort > .local/vite-ci.log 2>&1 &
          web_pid=$!
          .local/vendor-ci/caddy run --config .local/media-ci.json > .local/media-ci.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$server_pid" "$web_pid" "$gateway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          python3 scripts/with-env.py node scripts/smoke.mjs
          python3 scripts/with-env.py node crates/server/tests/acl.mjs
          node scripts/test_local_storage.mjs
          python3 scripts/with-env.py node scripts/test-media-admission.mjs
          python3 scripts/with-env.py .local/rtc-venv/bin/python scripts/test_media_rtc.py
          FFMPEG_PATH="$PWD/.local/vendor-ci/ffmpeg/bin/ffmpeg" FFPROBE_PATH="$PWD/.local/vendor-ci/ffmpeg/bin/ffprobe" python3 scripts/with-env.py node scripts/test_worker.mjs
          python3 scripts/test_worker_sandbox.py --output .local/qa-worker-sandbox/linux-result.json
          python3 scripts/with-env.py node scripts/test_p2p_discovery.mjs
          python3 scripts/with-env.py node scripts/p2p-browser-test.mjs
      - name: Real calls without LiveKit or diagnostic mode
        env:
          HARMONY_CHROME: /usr/bin/google-chrome
        run: |
          node scripts/test_calls.mjs
          DATABASE_URL=sqlite:.local/call-ci.db HARMONY_STORAGE_DIR=.local/call-ci-files HARMONY_BIND=127.0.0.1:8081 HARMONY_PUBLIC_API_URL=http://127.0.0.1:8081 HARMONY_MEDIA_TRANSPORT=p2p HARMONY_P2P_DIAGNOSTICS=false HARMONY_CALL_STUN_URLS= LIVEKIT_API_KEY= LIVEKIT_API_SECRET= python3 scripts/with-env.py target/debug/harmony-server > .local/calls-ci.log 2>&1 &
          calls_pid=$!
          node node_modules/vite/bin/vite.js apps/desktop --host 127.0.0.1 --port 1420 --strictPort > .local/vite-calls-ci.log 2>&1 &
          web_pid=$!
          trap 'kill "$calls_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health > /dev/null && curl -fsS http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 1
          done
          HARMONY_TEST_URL=http://127.0.0.1:8081 python3 scripts/with-env.py node scripts/call-browser-test.mjs
      - name: Eight-party P2P stability and authorization (native fake 720p15 runner profile)
        env:
          HARMONY_CHROME: /usr/bin/google-chrome
          HARMONY_CAPACITY_FPS: "15"
          HARMONY_CAPACITY_MEDIA_SOURCE: "native-fake"
          HARMONY_CAPACITY_BROWSER_MODE: "processes"
          HARMONY_CAPACITY_SECONDS: "180"
        run: |
          DATABASE_URL=sqlite:.local/capacity-ci.db HARMONY_STORAGE_DIR=.local/capacity-ci-files HARMONY_BIND=127.0.0.1:8081 HARMONY_PUBLIC_API_URL=http://127.0.0.1:8081 HARMONY_MEDIA_TRANSPORT=p2p HARMONY_P2P_DIAGNOSTICS=false HARMONY_CALL_STUN_URLS= HARMONY_MAX_ROOM_PARTICIPANTS=8 LIVEKIT_API_KEY= LIVEKIT_API_SECRET= python3 scripts/with-env.py target/debug/harmony-server > .local/capacity-ci.log 2>&1 &
          capacity_pid=$!
          node node_modules/vite/bin/vite.js apps/desktop --host 127.0.0.1 --port 1420 --strictPort > .local/vite-capacity-ci.log 2>&1 &
          web_pid=$!
          trap 'kill "$capacity_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health > /dev/null && curl -fsS http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 1
          done
          capacity_status=0
          HARMONY_TEST_URL=http://127.0.0.1:8081 HARMONY_CALL_REPORT=.local/capacity-ci-result.json python3 scripts/with-env.py node scripts/test_call_capacity.mjs || capacity_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.local/capacity-ci-result.json').read_text())
          print(json.dumps({
              'status': result['status'], 'functional': result['functional_status'],
              'quality': result['quality_status'], 'moderation': result['moderation_status'],
              'requested': result['requested'], 'stability': result.get('stability'),
              'moderation_timings': result['moderation'], 'error': result.get('error'),
              'last_interval': result.get('intervals', [])[-1:],
              'last_clients': [{
                  'audio_clocks': c['audioClocks'], 'rtp': c['rtp'],
                  'source_settings': c['sourceSettings'], 'capture_errors': c['captureErrors'],
              } for c in (result.get('samples') or [{}])[-1].get('clients', [])],
          }))
          PY
          exit "$capacity_status"
      - name: Build and exercise the supervised deployment
        run: |
          docker rm -f harmony-livekit
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env')
          path.write_text(path.read_text().replace('HARMONY_MEDIA_TRANSPORT=livekit', 'HARMONY_MEDIA_TRANSPORT=p2p'))
          PY
          docker compose build harmony
          docker compose run --no-deps --rm -T --entrypoint python3 harmony - <<'PY'
          import errno, os, stat, tempfile
          assert os.geteuid() == 10001
          for setting in ('SQLITE_TMPDIR', 'WORKER_TEMP_DIR'):
              directory = os.environ[setting]
              info = os.stat(directory)
              assert info.st_uid == os.geteuid() and stat.S_IMODE(info.st_mode) == 0o700
              with tempfile.TemporaryFile(dir=directory) as scratch:
                  scratch.write(b'private temporary storage check')
                  scratch.flush()
          try:
              with tempfile.TemporaryFile(dir='/tmp'):
                  raise AssertionError('The root filesystem must remain read-only')
          except OSError as error:
              assert error.errno == errno.EROFS
          print('Private temporary directories are writable; root filesystem is read-only')
          PY
          docker compose up -d harmony
          test -z "$(docker compose --profile sfu ps -q livekit)"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          HARMONY_TEST_STORAGE=1 HARMONY_TEST_MEDIA=1 python3 scripts/with-env.py node scripts/smoke.mjs
          sh scripts/backup.sh "$PWD/.local/ci-backup"
          sh scripts/restore.sh "$PWD/.local/ci-backup" "$PWD/.local/ci-restored"
          docker compose restart harmony
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker compose logs --tail 40 harmony livekit 2>&1 || true
          tail -60 .local/server-ci.log 2>/dev/null || true
          tail -60 .local/calls-ci.log 2>/dev/null || true
          tail -60 .local/capacity-ci.log 2>/dev/null || true
      - name: Stop the disposable deployment after diagnostics
        if: always()
        run: docker compose --profile public --profile sfu down --remove-orphans
  desktop:
    needs: server
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1"}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tools/theme-review.test.ts
      - name: Test native update policy
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build without distribution signing on ordinary pushes
        if: github.event_name != 'workflow_dispatch' || !inputs.package
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/ci-unsigned.json
          npm run desktop:build -- --bundles nsis --config ci-unsigned.json
      - name: Build signed distribution on trusted main
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify updater signatures using the official plugin
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cargo build --locked --manifest-path tools/updater-check/Cargo.toml
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $key = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).plugins.updater.pubkey
          $key | Set-Content -Encoding utf8NoBOM updater-public.key
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          python tools/updater-check/test_updater.py --artifact $artifact --signature "$artifact.sig" --public-key updater-public.key --version $version --output .local/qa-updater/windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and remove on disposable Windows runner
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          ./scripts/test_windows_install.ps1 -Path $artifact -Version $version -Output .local/qa-updater/windows-install.json
      - name: Hash the Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Save signed installer as a draft versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.package && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "Harmony $version, commit $env:GITHUB_SHA. Correção da contenção na autorização de chamadas e eliminação de reconfigurações de mídia repetidas. Voz, câmera, tela e áudio da tela P2P com controles de qualidade; LiveKit opcional. Cadastro aberto, comunidades com entrada controlada, SQLite, arquivos locais, worker isolado, personalização e atualizações Ed25519 preservados. Conectividade direta depende da rede; captura e áudio em Windows físico exigem homologação. Assinatura do updater não é Authenticode. Consulte docs/VALIDATION.md e docs/UPDATES.md."
          $notes | Out-File -Encoding utf8 release-notes.txt
          $files = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*).FullName
          gh release create $tag @files .local/qa-updater/windows-release.json .local/qa-updater/windows-install.json --draft --prerelease --target $env:GITHUB_SHA --title "Harmony $version — Windows" --notes-file release-notes.txt
