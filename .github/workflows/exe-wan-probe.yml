name: Probe the published Windows EXE
on:
  workflow_dispatch:
    inputs:
      image:
        description: Standard public Windows runner only
        type: choice
        options: ['windows-2022', 'windows-2025']
        default: 'windows-2022'
      runtime_upgrade:
        description: Diagnostic only; update the disposable VM using the signed Microsoft Evergreen installer
        type: boolean
        default: false
      profile:
        description: Requested native capture and receiver quality gate
        type: choice
        options: ['720p30', '1080p60', '1440p60']
        default: '720p30'
      release:
        description: Pinned published Windows package to test
        type: choice
        # Every choice requires real published installer and EXE hashes.
        # The compiled UI path fails closed on any identity mismatch.
        options: ['0.4.1', '0.4.2', '0.4.3', '0.4.4']
        default: '0.4.2'
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false && contains(fromJSON('["0.4.3","0.4.4"]'), inputs.release)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cohort: ${{ steps.fixture.outputs.cohort }}
      guild: ${{ steps.fixture.outputs.guild }}
      guild_name: ${{ steps.fixture.outputs.guild_name }}
      voice: ${{ steps.fixture.outputs.voice }}
      control: ${{ steps.fixture.outputs.control }}
      users: ${{ steps.fixture.outputs.users }}
      screen_sfu_enabled: ${{ steps.fixture.outputs.screen_sfu_enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26.13.0'}
      - name: Require the real pinned release before creating private fixture accounts
        env:
          HARMONY_EXE_RELEASE: ${{ inputs.release }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const version=process.env.HARMONY_EXE_RELEASE;
          assert.ok(['0.4.3','0.4.4'].includes(version));
          const release=JSON.parse(await readFile(`scripts/exe-wan/releases/${version}.json`,'utf8'));
          assert.equal(release.version,version);
          assert.equal(release.installer_url,`https://github.com/BersaneV/Harmony/releases/download/v${version}/Harmony_${version}_x64-setup.exe`);
          assert.match(release.installer_sha256,/^[a-f0-9]{64}$/);
          assert.match(release.main_sha256,/^[a-f0-9]{64}$/);
          JS
      - name: Validate direct-call fixture and capture guards
        run: node --test scripts/exe-wan/host-cpu.test.mjs scripts/exe-wan/browser-events.test.mjs scripts/exe-wan/observe.test.mjs scripts/exe-wan/capture-ui.test.mjs scripts/exe-wan/fixture-contract.test.mjs scripts/exe-wan/routes.test.mjs scripts/exe-wan/metrics.test.mjs scripts/exe-wan/auth.test.mjs scripts/exe-wan/profiles.test.mjs
      - name: Create the private ordinary-account fixture for the compiled UI
        id: fixture
        env:
          HARMONY_EXE_WAN_SEED: ${{ secrets.HARMONY_EXE_WAN_SEED }}
        run: node scripts/exe-wan/prepare.mjs
  probe:
    needs: prepare
    if: always() && github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false && contains(fromJSON('["windows-2022","windows-2025"]'), inputs.image) && ((contains(fromJSON('["0.4.3","0.4.4"]'), inputs.release) && needs.prepare.result == 'success') || (contains(fromJSON('["0.4.1","0.4.2"]'), inputs.release) && needs.prepare.result == 'skipped'))
    runs-on: ${{ inputs.image }}
    timeout-minutes: 15
    env:
      HARMONY_EXE_RELEASE: ${{ inputs.release }}
      HARMONY_EXE_PROFILE: ${{ inputs.profile }}
      HARMONY_EXE_WAN_SEED: ${{ contains(fromJSON('["0.4.3","0.4.4"]'), inputs.release) && secrets.HARMONY_EXE_WAN_SEED || '' }}
      HARMONY_COHORT: ${{ needs.prepare.outputs.cohort }}
      HARMONY_GUILD_ID: ${{ needs.prepare.outputs.guild }}
      HARMONY_GUILD_NAME: ${{ needs.prepare.outputs.guild_name }}
      HARMONY_VOICE_ID: ${{ needs.prepare.outputs.voice }}
      HARMONY_CONTROL_ID: ${{ needs.prepare.outputs.control }}
      HARMONY_COHORT_USERS: ${{ needs.prepare.outputs.users }}
      HARMONY_SCREEN_SFU_ENABLED: ${{ needs.prepare.outputs.screen_sfu_enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26.13.0'}
      - name: Verify and install the pinned published release
        shell: pwsh
        run: ./scripts/exe-wan/install.ps1
      - name: Update the disposable VM WebView2 runtime for comparison
        if: inputs.runtime_upgrade
        shell: pwsh
        run: ./scripts/exe-wan/runtime.ps1
      - name: Verify the compiled app, generated audio and native test-window capture
        run: node scripts/exe-wan/probe.mjs
