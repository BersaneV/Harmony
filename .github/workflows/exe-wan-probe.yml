name: Probe the published Windows EXE
on:
  workflow_dispatch:
    inputs:
      image:
        description: Standard public Windows runner only
        type: choice
        options: ['windows-2022', 'windows-2025']
        default: 'windows-2022'
      runtime_upgrade:
        description: Diagnostic only; update the disposable VM using the signed Microsoft Evergreen installer
        type: boolean
        default: false
      profile:
        description: Requested native capture and receiver quality gate
        type: choice
        options: ['720p30', '1080p60', '1440p60']
        default: '720p30'
      release:
        description: Pinned published Windows package to test
        type: choice
        options: ['0.4.1', '0.4.2']
        default: '0.4.2'
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false && contains(fromJSON('["windows-2022","windows-2025"]'), inputs.image)
    runs-on: ${{ inputs.image }}
    timeout-minutes: 15
    env:
      HARMONY_EXE_RELEASE: ${{ inputs.release }}
      HARMONY_EXE_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26.13.0'}
      - name: Verify and install the pinned published release
        shell: pwsh
        run: ./scripts/exe-wan/install.ps1
      - name: Update the disposable VM WebView2 runtime for comparison
        if: inputs.runtime_upgrade
        shell: pwsh
        run: ./scripts/exe-wan/runtime.ps1
      - name: Verify the compiled app, generated audio and native test-window capture
        run: node scripts/exe-wan/probe.mjs
