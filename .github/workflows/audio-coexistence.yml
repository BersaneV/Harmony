name: Windows external audio coexistence
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: '0.4.13'
        required: true
      installer_sha256:
        type: string
        default: '5494f7576a89625afdaa262b64f5ca5af7d91b7b39d8f2935a9643053981f6d5'
        required: true
      exe_sha256:
        type: string
        default: '58ea36ebcd72fc63ce9a9e6d2c5b59fa103fea9ee7327b01ae03a7cb71f77de7'
        required: true
permissions:
  contents: read
jobs:
  audio:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      HARMONY_AUDIO_VERSION: ${{ inputs.version }}
      HARMONY_AUDIO_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
      HARMONY_AUDIO_EXE_SHA256: ${{ inputs.exe_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned signed virtual audio fixture on disposable VM
        shell: pwsh
        run: ./scripts/audio-coexistence/setup-virtual-audio.ps1
      - name: Build Windows loopback and external player probes
        run: dotnet restore tools/windows-audio-lab/WindowsAudioLab.csproj --locked-mode
      - run: dotnet build tools/windows-audio-lab/WindowsAudioLab.csproj -c Release --no-restore
      - name: Inventory actual Windows audio endpoints
        shell: pwsh
        run: dotnet tools/windows-audio-lab/bin/Release/net8.0-windows/WindowsAudioLab.dll inventory | Tee-Object .local/qa-audio-coexistence/endpoints.json
      - name: Verify another process renders real PCM through the Windows mixer
        shell: pwsh
        run: |
          $dll = (Resolve-Path tools/windows-audio-lab/bin/Release/net8.0-windows/WindowsAudioLab.dll).Path
          $player = Start-Process dotnet -ArgumentList @($dll,'play','15') -PassThru -RedirectStandardOutput .local/qa-audio-coexistence/player.jsonl
          try {
            dotnet $dll meter 10 | Tee-Object .local/qa-audio-coexistence/baseline.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Loopback capture failed' }
            $samples = @(Get-Content .local/qa-audio-coexistence/baseline.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.kind -eq 'loopback_interval' })
            if ($samples.Count -ne 10 -or @($samples | Where-Object { $_.external_440 -gt 0.02 }).Count -lt 8) { throw 'External player is not measured in real WASAPI loopback' }
            Write-Host 'PASS baseline external process -> Windows mixer -> real loopback PCM'
          } finally { if (-not $player.HasExited) { Stop-Process -Id $player.Id } }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: "26.13.0"}
      - run: npm ci
      - name: Verify measurement rejection gates
        run: node --test scripts/audio-coexistence/measurements.test.mjs
      - name: Extract the exact versioned Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:HARMONY_AUDIO_VERSION -notmatch '^0\.\d+\.\d+$' -or $env:HARMONY_AUDIO_INSTALLER_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:HARMONY_AUDIO_EXE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'A version and both exact SHA256 hashes are required' }
          $folder = Join-Path $env:RUNNER_TEMP 'harmony-audio-app'
          New-Item -ItemType Directory -Path $folder | Out-Null
          $filename = 'Harmony_' + $env:HARMONY_AUDIO_VERSION + '_x64-setup.exe'
          $setup = Join-Path $folder $filename
          gh release download ('v'+$env:HARMONY_AUDIO_VERSION) --repo BersaneV/Harmony --pattern $filename --dir $folder
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release download failed' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HARMONY_AUDIO_INSTALLER_SHA256) { throw 'Published installer differs' }
          & 'C:\Program Files\7-Zip\7z.exe' e $setup "-o$folder" harmony-desktop.exe -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $folder 'harmony-desktop.exe'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HARMONY_AUDIO_EXE_SHA256) { throw 'Published executable differs' }
          "HARMONY_AUDIO_EXE=$exe" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Published EXE call and screen with independent Windows audio
        run: node scripts/audio-coexistence/run.mjs
      - name: Record the exact resolved probe dependencies
        if: always()
        shell: pwsh
        run: Get-Content tools/windows-audio-lab/packages.lock.json -ErrorAction SilentlyContinue
      - name: Show bounded fixture diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem .local/qa-audio-coexistence -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName -Tail 15 }
