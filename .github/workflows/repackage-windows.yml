name: Repackage identically verified Windows product
on:
  workflow_dispatch:
    inputs:
      verified_run:
        description: Failed delivery run with every product gate successful
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verified-windows-package
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'BersaneV/Harmony' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify every product gate and identical source before re-packaging
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
        run: python scripts/verify_packaging_source.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "26.13.0"}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: "1.99.1"}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tools/theme-review.test.ts
      - name: Test native update policy
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed distribution on trusted main
        if: github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify updater signatures using the official plugin
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cargo build --locked --manifest-path tools/updater-check/Cargo.toml
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $key = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).plugins.updater.pubkey
          $key | Set-Content -Encoding utf8NoBOM updater-public.key
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          python tools/updater-check/test_updater.py --artifact $artifact --signature "$artifact.sig" --public-key updater-public.key --version $version --output .local/qa-updater/windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and remove on disposable Windows runner
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $artifact = "apps/desktop/src-tauri/target/release/bundle/nsis/Harmony_" + $version + "_x64-setup.exe"
          ./scripts/test_windows_install.ps1 -Path $artifact -Version $version -Output .local/qa-updater/windows-install.json
      - name: Hash the Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8NoBOM apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Save signed installer as a draft versioned release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $remoteHead = gh api repos/BersaneV/Harmony/git/ref/heads/main --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $remoteHead -cne $env:GITHUB_SHA) { throw 'Main advanced during packaging; preserve this result and retry with verified sources.' }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "Harmony $version, commit $env:GITHUB_SHA.`n`n" + (Get-Content "docs/releases/$version.md" -Raw)
          $notes | Out-File -Encoding utf8 release-notes.txt
          $files = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*).FullName
          $existing = (gh api 'repos/BersaneV/Harmony/releases?per_page=100' | ConvertFrom-Json) | Where-Object tag_name -eq $tag
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect owned releases' }
          if ($existing) {
            if (-not $existing.draft -or $existing.target_commitish -cne $env:GITHUB_SHA) { throw 'Existing release does not match this unpublished build' }
            gh release upload $tag @files .local/qa-updater/windows-release.json .local/qa-updater/windows-install.json --clobber
          } else {
            gh release create $tag @files .local/qa-updater/windows-release.json .local/qa-updater/windows-install.json --draft --prerelease --target $env:GITHUB_SHA --title "Harmony $version — Windows" --notes-file release-notes.txt
          }
