[package]
name = "harmony-desktop"
version = "0.3.0"
description = "Comunicação self-hosted para sua comunidade"
authors = ["Harmony contributors"]
license = "Apache-2.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
url = "2.5"
open = "5.4.5"
tauri-plugin-updater = "=2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[patch.crates-io]
tauri-plugin-updater = { path = "../../../vendor/tauri-plugin-updater" }
