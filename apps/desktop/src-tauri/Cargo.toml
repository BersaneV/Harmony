[package]
name = "harmony-desktop"
version = "0.1.0"
description = "Comunicação self-hosted para sua comunidade"
authors = ["Harmony contributors"]
license = "Apache-2.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
url = "2.5"
open = "5.4.5"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
