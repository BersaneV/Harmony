[package]
name = "harmony-native-capture"
version = "0.4.3"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
capture-diagnostics = []

[[example]]
name = "wgc_diagnostics"
required-features = ["capture-diagnostics"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Metadata", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
