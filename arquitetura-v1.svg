<text x="80" y="112" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#122341" text-anchor="start">Comunicação sob nosso controle</text>
<text x="80" y="147" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#354762" text-anchor="start">Windows · Rust + React · self-hosted · sem assinatura obrigatória</text>
<rect x="80" y="195" width="1280" height="185" rx="18" fill="#eaf0ff" stroke="#9eafe0" stroke-width="2"/>
<text x="110" y="237" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#263d78" text-anchor="start">01  CLIENTE WINDOWS  .exe</text>
<text x="110" y="282" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#142549" text-anchor="start">Tauri 2 + React + TypeScript</text>
<text x="110" y="321" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Interface, temas e notificações</text>
<text x="110" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Cache local + cofre de credenciais</text>
<text x="610" y="282" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#142549" text-anchor="start">Painel do Victor</text>
<text x="610" y="321" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Contas, sessões e reset</text>
<text x="610" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Permissões e cotas de uso</text>
<text x="1010" y="282" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#142549" text-anchor="start">LiveKit Client</text>
<text x="1010" y="321" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Resolução, FPS e bitrate</text>
<text x="1010" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">144p → 1440p / 2160p*</text>
<rect x="50" y="490" width="1340" height="945" rx="24" fill="#eef3fb" stroke="#c5d3e8" stroke-width="2"/>
<text x="85" y="530" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#263d78" text-anchor="start">02  SERVIDOR LINUX · UM NÓ NO PILOTO</text>
<text x="85" y="564" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Docker Engine + Compose · componentes portáveis</text>
<rect x="100" y="595" width="1240" height="125" rx="18" fill="#fff" stroke="#9fbbdf" stroke-width="2"/>
<text x="130" y="639" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#173d72" text-anchor="start">Caddy + camada 4</text>
<text x="130" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#354762" text-anchor="start">HTTPS / WSS · certificados · TURN TLS por SNI na porta 443</text>
<text x="130" y="703" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#354762" text-anchor="start">Entradas públicas controladas; banco e administração da infraestrutura em rede privada.</text>
