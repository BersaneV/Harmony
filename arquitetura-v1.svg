<text x="881" y="960" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#356dc6" text-anchor="end">e controle</text>
<path d="M280 1090 V1190" fill="none" stroke="#356dc6" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="300" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#356dc6" text-anchor="start">SQL transacional</text>
<path d="M460 1272 H500" fill="none" stroke="#ac7926" stroke-width="3" stroke-linejoin="round" marker-end="url(#gold)"/>
<path d="M860 1308 H900" fill="none" stroke="#f0f4fb" stroke-width="12"/>
<path d="M860 1308 H900" fill="none" stroke="#ac7926" stroke-width="3" stroke-linejoin="round" marker-end="url(#gold)"/>
<path d="M280 1355 V1378 H75 V1488 H280 V1540" fill="none" stroke="#7b879b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#gray)"/>
<path d="M1120 1355 V1378 H1365 V1488 H1120 V1540" fill="none" stroke="#7b879b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#gray)"/>
<text x="720" y="1484" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#677791" text-anchor="middle">Backup de dados + configuração; infraestrutura em um só host não é alta disponibilidade.</text>
<text x="80" y="1730" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#263d78" text-anchor="start">Hospedagem candidata: Oracle Always Free, condicionada à elegibilidade e à disponibilidade.</text>
<text x="80" y="1764" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">* Qualidade depende da captura, do equipamento e da rede. Orçamento R$ 0 exige limites de uso.</text>
<text x="80" y="1794" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#677791" text-anchor="start">12 NOV 2026 · DESENHO DE ARQUITETURA · HOSPEDAGEM E DESEMPENHO AINDA NÃO VALIDADOS</text>
</g></svg>