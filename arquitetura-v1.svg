<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1810" viewBox="0 0 1810 1810" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura v1 da plataforma de comunicação self-hosted</title>
<desc id="desc">Cliente Windows Tauri React, servidor Rust com PostgreSQL, LiveKit TURN e SeaweedFS, processamento assíncrono e backup independente. Orçamento operacional de zero reais com limites.</desc>
<defs>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356dc6"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168572"/></marker>
  <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ac7926"/></marker>
  <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b879b"/></marker>
</defs>
<rect width="1810" height="1810" fill="#f5f7fc"/>
<g transform="translate(185,0)">

