<text x="980" y="894" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#176957" text-anchor="start">LiveKit SFU + TURN</text>
<text x="980" y="938" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Voz, câmera e tela</text>
<text x="980" y="973" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Encaminha mídia entre usuários</text>
<text x="980" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Camadas e bitrate adaptativos</text>
<text x="980" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Sem transcodificação ao vivo</text>
<rect x="100" y="1190" width="360" height="165" rx="18" fill="#fff5e4" stroke="#d6ba7a" stroke-width="2"/>
<text x="125" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#76521e" text-anchor="start">PostgreSQL</text>
<text x="125" y="1268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Contas, mensagens e sessões</text>
<text x="125" y="1298" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Permissões, busca e auditoria</text>
<text x="125" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Jobs + outbox persistentes</text>
<rect x="500" y="1190" width="360" height="165" rx="18" fill="#fff5e4" stroke="#d6ba7a" stroke-width="2"/>
<text x="525" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#76521e" text-anchor="start">Worker + FFmpeg</text>
<text x="525" y="1268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Jobs persistidos no banco</text>
<text x="525" y="1298" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Validação e prévias de arquivos</text>
<text x="525" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">CPU e memória limitadas</text>
<rect x="900" y="1190" width="440" height="165" rx="18" fill="#fff5e4" stroke="#d6ba7a" stroke-width="2"/>
<text x="925" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#76521e" text-anchor="start">SeaweedFS · S3</text>
<text x="925" y="1268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Anexos, avatares, temas e derivados</text>
<text x="925" y="1298" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Objetos privados · URLs curtas</text>
<text x="925" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Disco persistente com cotas</text>
<text x="100" y="1407" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50617d" text-anchor="start">Presença em memória · sem Valkey no piloto · logs locais · limites de disco e tráfego</text>
<rect x="100" y="1540" width="1240" height="135" rx="18" fill="#fff" stroke="#9caabd" stroke-width="2"/>
<text x="130" y="1584" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#354762" text-anchor="start">03  BACKUP INDEPENDENTE · RESTIC</text>
<text x="130" y="1624" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#354762" text-anchor="start">Dumps consistentes + objetos + configuração · cópia criptografada fora do servidor</text>
<text x="130" y="1653" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#354762" text-anchor="start">Destino ainda a definir; restauração deve ser testada antes de guardar dados importantes.</text>
<path d="M470 380 V480 H850 V595" fill="none" stroke="#356dc6" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="490" y="429" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#356dc6" text-anchor="start">HTTPS / WSS</text>
