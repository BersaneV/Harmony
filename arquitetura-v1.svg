<text x="130" y="894" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#173d72" text-anchor="start">Rust · monólito modular</text>
<text x="130" y="928" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#356dc6" text-anchor="start">Axum · Tokio · SQLx</text>
<text x="130" y="967" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#354762" text-anchor="start">Identidade, comunidades, canais e mensagens</text>
<text x="130" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#354762" text-anchor="start">Permissões, moderação e reset de acesso</text>
<text x="130" y="1037" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#354762" text-anchor="start">API REST + WebSocket + controle de recursos</text>
