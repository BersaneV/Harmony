<path d="M470 720 V850" fill="none" stroke="#356dc6" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="490" y="789" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#356dc6" text-anchor="start">API + eventos</text>
<path d="M1145 720 V850" fill="none" stroke="#356dc6" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1130" y="770" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#356dc6" text-anchor="end">Sinalização</text>
<text x="1130" y="797" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#356dc6" text-anchor="end">+ TURN TLS</text>
<path d="M890 720 V1272 H900" fill="none" stroke="#ac7926" stroke-width="3" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="868" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9a6b22" text-anchor="end">Arquivos via HTTPS / URLs assinadas</text>
<path d="M840 1002 H950" fill="none" stroke="#f0f4fb" stroke-width="12"/>
<path d="M840 1002 H950" fill="none" stroke="#356dc6" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#blue)"/>
