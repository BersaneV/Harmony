[package]
name = "harmony-database"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "harmony-db"
path = "src/main.rs"

[dependencies]
harmony-search = { path = "../search" }
serde_json.workspace = true
uuid.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }


# SQLite 3.51.3 fixes the multi-process WAL-reset race (upstream WAL docs).
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
