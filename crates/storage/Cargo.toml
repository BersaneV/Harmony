[package]
name = "harmony-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.48", features = ["fs", "io-util", "rt"] }
sha2 = "0.10.9"
hex = "0.4.3"
uuid.workspace = true
libc = "0.2"
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.31"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
