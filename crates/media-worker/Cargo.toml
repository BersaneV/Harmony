[package]
name = "harmony-media-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
libc = "0.2"
tempfile = "3.23"
