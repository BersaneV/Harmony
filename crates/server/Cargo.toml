[package]
name = "harmony-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
harmony-domain = { path = "../domain" }
harmony-application = { path = "../application" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "limit", "set-header"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = "0.5.3"
jsonwebtoken = "9.3.1"
rand = "0.8.5"
sha2 = "0.10.9"
hex = "0.4.3"
futures-util = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
infer = "0.19.0"
url = "2.5.7"
[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
