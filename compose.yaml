name: harmony
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  harmony:
    build: {context: ., dockerfile: infra/Dockerfile.harmony}
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: sqlite:/data/harmony.db
      HARMONY_BIND: 127.0.0.1:8080
      HARMONY_STORAGE_BACKEND: local
      HARMONY_STORAGE_DIR: /data/files
      HARMONY_WEB_DIR: /srv/harmony
      WORKER_TEMP_DIR: /tmp/harmony-media
      WORKER_TIMEOUT_SECONDS: "30"
      WORKER_LEASE_SECONDS: "120"
      WORKER_MEMORY_BYTES: "536870912"
    volumes: ["data:/data"]
    depends_on: [livekit]
    read_only: true
    tmpfs: ["/tmp/harmony-media:size=128m,mode=0700,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 2
    mem_limit: 1536m
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *logging
  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: ["--config", /etc/livekit.yaml]
    network_mode: host
    volumes: ["./.local/deploy/livekit.yaml:/etc/livekit.yaml:ro"]
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
  caddy:
    profiles: [public]
    build: {context: ., dockerfile: infra/Dockerfile.caddy}
    network_mode: host
    volumes:
      - ./.local/deploy/caddy.json:/etc/caddy/harmony.json:ro
      - caddy:/data
    depends_on:
      harmony: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
volumes:
  data:
  caddy:
